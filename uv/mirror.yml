extends: ../mirror-base.yml

name: uv

# Logical index package `astral-sh/uv` at the physical path
# `ghcr.io/ocx-contrib/astral-sh/uv` — slash segments, never hyphen-flattened.
# The first segment must be this repo's own GitHub owner: GITHUB_TOKEN only
# authorises packages owned by the repo the workflow runs in.
#
# `ocx-contrib/mirror-uv` publishes the same upstream to the older flat
# coordinate `ocx.sh/uv`. Both are live; this is the vendor-grouped successor,
# the same way mirror-kitware/cmake succeeds mirror-cmake. Retiring the flat
# repo is a separate decision — until then the two coexist and the version
# floor below is deliberately kept in step with it.
target:
  registry: ghcr.io
  repository: ocx-contrib/astral-sh/uv

source:
  type: github_release
  owner: astral-sh
  repo: uv
  # Bare semver, no `v` prefix — verified across all 299 releases: every tag
  # matches `\d+\.\d+\.\d+` exactly.
  tag_pattern: "^(?P<version>\\d+\\.\\d+\\.\\d+)$"

# ─── libc gate (Phase 3.5) — the evidence, not the conclusion ───────────────
#
# Upstream ships a glibc-linked gnu build AND a fully static musl build for
# both Linux arches. Measured on 0.12.1:
#
#   $ file uv-x86_64-unknown-linux-musl/uv
#   ELF 64-bit LSB pie executable, x86-64, static-pie linked, stripped
#   $ readelf -l … | grep -A1 INTERP  → (no INTERP segment)
#   $ ldd …                           → statically linked
#   $ file uv-aarch64-unknown-linux-musl/uv
#   ELF 64-bit LSB executable, ARM aarch64, statically linked, stripped
#
#   $ file uv-x86_64-unknown-linux-gnu/uv
#   … dynamically linked, interpreter /lib64/ld-linux-x86-64.so.2
#   $ ldd … → libgcc_s libRT libpthread libm libdl libc   (all glibc)
#   $ file uv-aarch64-unknown-linux-gnu/uv
#   … dynamically linked, interpreter /lib/ld-linux-aarch64.so.1
#
# Both are mirrored, but NOT as a glibc/musl pair. `os.features` states what the
# artifact REQUIRES OF THE HOST — it is not a label for how the artifact was
# built:
#
#   gnu build  -> `+libc.glibc`   genuinely needs a glibc loader
#   musl build -> BARE key        static, no PT_INTERP, requires nothing
#
# Tagging the static build `+libc.musl` would be a FALSE REQUIREMENT: it would
# claim the artifact needs a musl userland and so hide it from every glibc host,
# even though it runs there perfectly. Empty `os.features` is the honest
# statement "requires nothing".
#
# Resolution then sorts itself out, deterministically: matching is subset-based
# and scored by specificity, so a glibc host is compatible with both keys and
# takes `+libc.glibc` (it scores higher — ocx asserts "(1,1) must outrank
# (1,0)"), while a musl host is incompatible with the gnu key and takes the
# static build. Container legs per key live in ../mirror-base.yml.
#
# Publishing the gnu build at all (rather than the static one alone) buys the
# glibc host its own userland's resolver: a static musl binary uses musl's DNS
# path, which ignores nsswitch.conf and loads no NSS modules — and uv resolves
# package indexes over the network, so that difference is reachable for a real
# user on a corporate network.
#
# glibc floor, measured per arch (readelf -V, newest symbol): x86_64 GLIBC_2.17,
# aarch64 GLIBC_2.28. Not symmetric — different toolchains. Nothing in the spec
# expresses a floor, so this only matters for the container images, and
# ubuntu:24.04 / fedora:40 both ship glibc 2.39.
#
# ─── Scope (Phase 2, verified against 0.10.0, 0.11.0 and 0.12.1) ────────────
#
# Upstream also publishes, and this mirror deliberately does not carry:
#   i686-{unknown-linux-gnu,unknown-linux-musl,pc-windows-msvc}  — 32-bit
#   arm-unknown-linux-musleabihf, armv7-unknown-linux-{gnueabihf,musleabihf}
#   powerpc64le-unknown-linux-gnu, riscv64gc-unknown-linux-{gnu,musl}
#   s390x-unknown-linux-gnu                                      — no GHA runner
#   source.tar.gz, sha256.sum, dist-manifest.json, uv-installer.{sh,ps1}
#
# The anchored ^…$ regexes are what keep those out — in particular they exclude
# every `.sha256` sidecar, which an unanchored pattern would match as a second
# asset and fail resolution as ambiguous.
#
# Resolution verified BOTH ways at 0.10.0 (the floor), 0.11.0 and 0.12.1: each
# of the eight patterns below matches EXACTLY one asset. A pattern matching
# zero is silently skipped, not an error — it would yield a green run with a
# missing platform.
assets:
  "linux/amd64+libc.glibc":
    - "^uv-x86_64-unknown-linux-gnu\\.tar\\.gz$"
  # Static — requires nothing, so a BARE key with no feature suffix.
  linux/amd64:
    - "^uv-x86_64-unknown-linux-musl\\.tar\\.gz$"
  "linux/arm64+libc.glibc":
    - "^uv-aarch64-unknown-linux-gnu\\.tar\\.gz$"
  linux/arm64:
    - "^uv-aarch64-unknown-linux-musl\\.tar\\.gz$"
  darwin/amd64:
    - "^uv-x86_64-apple-darwin\\.tar\\.gz$"
  darwin/arm64:
    - "^uv-aarch64-apple-darwin\\.tar\\.gz$"
  windows/amd64:
    - "^uv-x86_64-pc-windows-msvc\\.zip$"
  windows/arm64:
    - "^uv-aarch64-pc-windows-msvc\\.zip$"

# Every Linux and macOS tarball wraps its executables in a single
# `uv-<triple>/` directory with no `bin/` inside it, so stripping one level
# puts them at the content root. The Windows zips already ship uv.exe /
# uvw.exe / uvx.exe flat at the root, so they strip nothing. Both settings land
# the executables at the same place, which is why one PATH entry covers all
# eight platforms.
asset_type:
  default:
    type: archive
    strip_components: 1
  platforms:
    windows/amd64:
      type: archive
      strip_components: 0
    windows/arm64:
      type: archive
      strip_components: 0

# `off`, and it cannot be otherwise here. The scan needs an interface PATH entry
# of the form ${installPath}/<dir>, and this package has none: the executables
# sit at the content root on every platform. Keeping the Linux wrapper
# (strip_components: 0) would give one, but its name embeds the target triple
# (`uv-x86_64-unknown-linux-musl`), so that would need six different metadata
# files — and the Windows archives have no wrapper at all, so they would still
# be bare and would still fail the load-time gate at exit 65.
#
# So `binaries` is hand-listed instead, from the actual archive listings, which
# mirror-yml.md explicitly blesses: "leaves bin_scan: off and hand-lists
# binaries; off with the same metadata is a perfectly good spec".
bin_scan: off

metadata:
  # Linux and macOS ship `uv` + `uvx`. Windows adds `uvw.exe`, the windowless
  # launcher — verified present in BOTH windows zips (x86_64 and aarch64), so
  # one override file covers both keys.
  default: metadata.json
  platforms:
    windows/amd64: metadata-windows.json
    windows/arm64: metadata-windows.json

catalog:
  # This package's own logo, beside the spec. The repo-root logo.svg is the
  # CPython/PSF mark and belongs to python-build-standalone — not reusable here.
  logo: logo.svg

versions:
  # Kept in step with ocx-contrib/mirror-uv, which already publishes this floor
  # to ocx.sh/uv, so the two coordinates do not diverge in coverage. 49 releases
  # from here to 0.12.1.
  #
  # The hard lower bound is 0.5.25 — the first release shipping
  # uv-aarch64-pc-windows-msvc.zip. Below that, windows/arm64 would resolve
  # zero assets and be silently skipped rather than erroring.
  min: "0.10.0"
  new_per_run: 5
  # Staggered off the other specs in this repo (python-build-standalone runs at
  # :25) so the four mirrors here do not all poll on the same minute.
  poll_interval: "36 1-23/6 * * *"

tests:
  # `script:` resolves from the REPOSITORY ROOT — the opposite of
  # `metadata.default` and `catalog.logo` just above, which resolve against
  # this spec's own directory.
  - name: smoke
    script: uv/tests/smoke.star

annotations:
  # Upstream is dual-licensed: LICENSE-APACHE + LICENSE-MIT at the repo root.
  org.opencontainers.image.licenses: "Apache-2.0 OR MIT"

announce:
  package: astral-sh/uv
  fork: ocx-contrib/index

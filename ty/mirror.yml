extends: ../mirror-base.yml

name: ty

# Logical index package `astral-sh/ty` at the physical path
# `ghcr.io/ocx-contrib/astral-sh/ty` — slash segments, never hyphen-flattened.
# The first segment must be this repo's own GitHub owner: GITHUB_TOKEN only
# authorises packages owned by the repo the workflow runs in.
target:
  registry: ghcr.io
  repository: ocx-contrib/astral-sh/ty

source:
  type: github_release
  owner: astral-sh
  repo: ty
  # Bare semver, no `v` prefix. Upstream also tags prereleases as
  # `0.0.1-alpha.35` / `0.0.0-alpha.4`; the anchored pattern has no
  # pre-release part, so those never match and never reach the plan.
  # `skip_prereleases: true` (from ../mirror-base.yml) is the second guard.
  tag_pattern: "^(?P<version>\\d+\\.\\d+\\.\\d+)$"

# ─── libc gate (Phase 3.5) — the evidence, not the conclusion ───────────────
#
# Upstream ships a glibc-linked gnu build AND a fully static musl build for
# both Linux arches. Measured on 0.0.65:
#
#   $ file ty-x86_64-unknown-linux-musl/ty
#   ELF 64-bit LSB pie executable, x86-64, static-pie linked, stripped
#   $ readelf -l … | grep -A1 INTERP  → (no INTERP segment)
#   $ ldd …                           → statically linked
#   $ file ty-aarch64-unknown-linux-musl/ty
#   ELF 64-bit LSB executable, ARM aarch64, statically linked, stripped
#
#   $ file ty-x86_64-unknown-linux-gnu/ty
#   … dynamically linked, interpreter /lib64/ld-linux-x86-64.so.2
#   $ file ty-aarch64-unknown-linux-gnu/ty
#   … dynamically linked, interpreter /lib/ld-linux-aarch64.so.1
#
# Both are mirrored, but NOT as a glibc/musl pair. `os.features` states what the
# artifact REQUIRES OF THE HOST — it is not a label for how the artifact was
# built:
#
#   gnu build  -> `+libc.glibc`   genuinely needs a glibc loader
#   musl build -> BARE key        static, no PT_INTERP, requires nothing
#
# Tagging the static build `+libc.musl` would be a FALSE REQUIREMENT: it would
# claim the artifact needs a musl userland and so hide it from every glibc host,
# even though it runs there perfectly. Empty `os.features` is the honest
# statement "requires nothing".
#
# Resolution then sorts itself out, deterministically: matching is subset-based
# and scored by specificity, so a glibc host is compatible with both keys and
# takes `+libc.glibc` (it scores higher — ocx asserts "(1,1) must outrank
# (1,0)"), while a musl host is incompatible with the gnu key and takes the
# static build. Container legs per key live in ../mirror-base.yml.
#
# glibc floor, measured per arch (readelf -V, newest symbol): GLIBC_2.17 on
# both x86_64 and aarch64. (uv's aarch64 build needs 2.28 — the floors are not
# symmetric in general, which is why each package measures its own.) Nothing in
# the spec expresses a floor, so this only matters for the container images,
# and ubuntu:24.04 / fedora:40 both ship glibc 2.39.
#
# ─── Scope (Phase 2, verified against 0.0.40, 0.0.50 and 0.0.65) ────────────
#
# Upstream also publishes, and this mirror deliberately does not carry:
#   i686-{unknown-linux-gnu,unknown-linux-musl,pc-windows-msvc}  — 32-bit
#   arm-unknown-linux-musleabihf, armv7-unknown-linux-{gnueabihf,musleabihf}
#   powerpc64le-unknown-linux-gnu, riscv64gc-unknown-linux-gnu
#   s390x-unknown-linux-gnu                                      — no GHA runner
#   source.tar.gz, sha256.sum, dist-manifest.json, ty-installer.{sh,ps1}
#
# The anchored ^…$ regexes are what keep those out — in particular they exclude
# every `.sha256` sidecar, which an unanchored pattern would match as a second
# asset and fail resolution as ambiguous.
#
# Resolution verified BOTH ways at 0.0.40 (the floor), 0.0.50 and 0.0.65: each
# of the eight patterns below matches EXACTLY one asset. A pattern matching
# zero is silently skipped, not an error — it would yield a green run with a
# missing platform.
assets:
  "linux/amd64+libc.glibc":
    - "^ty-x86_64-unknown-linux-gnu\\.tar\\.gz$"
  # Static — requires nothing, so a BARE key with no feature suffix.
  linux/amd64:
    - "^ty-x86_64-unknown-linux-musl\\.tar\\.gz$"
  "linux/arm64+libc.glibc":
    - "^ty-aarch64-unknown-linux-gnu\\.tar\\.gz$"
  linux/arm64:
    - "^ty-aarch64-unknown-linux-musl\\.tar\\.gz$"
  darwin/amd64:
    - "^ty-x86_64-apple-darwin\\.tar\\.gz$"
  darwin/arm64:
    - "^ty-aarch64-apple-darwin\\.tar\\.gz$"
  windows/amd64:
    - "^ty-x86_64-pc-windows-msvc\\.zip$"
  windows/arm64:
    - "^ty-aarch64-pc-windows-msvc\\.zip$"

# Every Linux and macOS tarball wraps its single executable in a `ty-<triple>/`
# directory with no `bin/` inside it, so stripping one level puts it at the
# content root. The Windows zips already ship ty.exe flat at the root, so they
# strip nothing. Both settings land the executable at the same place, which is
# why one PATH entry covers all eight platforms.
asset_type:
  default:
    type: archive
    strip_components: 1
  platforms:
    windows/amd64:
      type: archive
      strip_components: 0
    windows/arm64:
      type: archive
      strip_components: 0

# `off`, and it cannot be otherwise here. The scan needs an interface PATH entry
# of the form ${installPath}/<dir>, and this package has none: the executable
# sits at the content root on every platform. Keeping the Linux wrapper
# (strip_components: 0) would give one, but its name embeds the target triple
# (`ty-x86_64-unknown-linux-musl`), so that would need six different metadata
# files — and the Windows archives have no wrapper at all, so they would still
# be bare and would still fail the load-time gate at exit 65.
#
# So `binaries` is hand-listed instead, from the actual archive listings, which
# mirror-yml.md explicitly blesses: "leaves bin_scan: off and hand-lists
# binaries; off with the same metadata is a perfectly good spec".
bin_scan: off

metadata:
  # One file for every platform: a single `ty` executable, and the Windows zips
  # ship nothing beyond `ty.exe` (verified on both windows arches).
  default: metadata.json

catalog:
  # This package's own logo, beside the spec. The repo-root logo.svg is the
  # CPython/PSF mark and belongs to python-build-standalone — not reusable here.
  logo: logo.svg

versions:
  # 26 releases from here to 0.0.65. ty is pre-release software on a 0.0.x
  # line, so deep history has little pinning value; this covers the range
  # anyone is realistically running.
  #
  # The hard lower bound is 0.0.2 — the first bare-semver release, and already
  # shipping ty-aarch64-pc-windows-msvc.zip. Everything below it is an
  # `-alpha.N` prerelease the tag pattern does not match.
  min: "0.0.40"
  new_per_run: 5
  # Staggered off the other specs in this repo (uv :10, ruff :15,
  # python-build-standalone :25) so the four mirrors here do not all poll on
  # the same minute.
  poll_interval: "20 */6 * * *"

tests:
  # `script:` resolves from the REPOSITORY ROOT — the opposite of
  # `metadata.default` and `catalog.logo` just above, which resolve against
  # this spec's own directory.
  - name: smoke
    script: ty/tests/smoke.star

annotations:
  org.opencontainers.image.licenses: "MIT"

announce:
  package: astral-sh/ty
  fork: ocx-contrib/index
